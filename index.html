<!doctype html>
<html lang="fr" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- SEO Meta Tags -->
    <title>Traducteur en Ligne | Instantané & Précis propulsé par DeepL</title>
    <meta
      name="description"
      content="Traduisez instantanément vos textes en français, anglais, espagnol et plus encore. Interface glassmorphic moderne, fluide et gratuite propulsée par l'API DeepL."
    />
    <meta
      name="keywords"
      content="traduction, traducteur en ligne, deepl, traduction instantanée, french, english, spanish"
    />
    <meta name="author" content="Orssi Mp - EASYWORK" />
    <meta name="robots" content="index, follow" />
    <link
      rel="canonical"
      href="https://OrssiMp.github.io/Frontend-translator/"
    />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta
      property="og:url"
      content="https://OrssiMp.github.io/Frontend-translator/"
    />
    <meta
      property="og:title"
      content="Traducteur en Ligne | Instantané & Précis"
    />
    <meta
      property="og:description"
      content="Traduisez vos textes instantanément avec une interface glassmorphic élégante."
    />
    <meta
      property="og:image"
      content="https://OrssiMp.github.io/Frontend-translator/og-image.jpg"
    />

    <!-- Twitter Cards -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta
      name="twitter:title"
      content="Traducteur en Ligne | Instantané & Précis"
    />
    <meta
      name="twitter:description"
      content="Traduisez vos textes instantanément avec une interface glassmorphic élégante."
    />
    <meta
      name="twitter:image"
      content="https://OrssiMp.github.io/Frontend-translator/og-image.jpg"
    />

    <!-- Favicon & Icons -->
    <link rel="icon" type="image/png" href="/Frontend-translator/assets/logo-Daxa8YGs.png" />
    <link rel="apple-touch-icon" href="/Frontend-translator/assets/logo-Daxa8YGs.png" />

    <!-- Google Material Symbols -->
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0"
    />
    <script type="module" crossorigin src="/Frontend-translator/assets/index-BvXUyeKB.js"></script>
    <link rel="stylesheet" crossorigin href="/Frontend-translator/assets/index-D2Y-ApUM.css">
  </head>

  <body
    class="min-h-screen bg-logo text-base-content antialiased flex flex-col"
  >
    <div id="overlay" class="fixed inset-0 bg-black/30"></div>
    <!-- Header principal -->
    <header
      class="w-full p-4 flex items-center justify-between max-w-7xl mx-auto z-10"
    >
      <!-- Logo & Titre -->
      <div class="flex items-center gap-3">
        <img
          class="rounded-full w-12 h-12 shadow-md border border-white/20"
          src=""
          alt="Logo Traducteur"
        />
        <h1
          class="text-xl font-bold tracking-tight text-slate-800 dark:text-white"
        >
          Translator
        </h1>
      </div>

      <!-- Toggle de Thème (A11y + SEO friendly) -->
      <label
        aria-label="Changer le thème de couleur"
        class="swap swap-rotate size-12 rounded-full grid place-items-center cursor-pointer select-none bg-linear-to-br from-white/30 via-white/10 to-white/5 dark:from-white/20 dark:via-white/5 dark:to-transparent backdrop-blur-xl border border-white/50 dark:border-white/20 shadow-md hover:scale-105 active:scale-95 transition-all duration-300 group"
      >
        <input
          type="checkbox"
          class="theme-controller sr-only"
          value="synthwave"
        />

        <!-- Icône Soleil -->
        <svg
          class="swap-off col-start-1 row-start-1 h-6 w-6 text-amber-300 drop-shadow-[0_0_10px_rgba(252,211,77,0.8)] group-hover:rotate-45 transition-transform duration-500 ease-out"
          xmlns="http://www.w3.org/2000/svg"
          fill="none"
          viewBox="0 0 24 24"
          stroke-width="2"
          stroke="currentColor"
        >
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            d="M12 3v2.25m6.364.386-1.591 1.591M21 12h-2.25m-.386 6.364-1.591-1.591M12 18.75V21m-4.773-4.227-1.591 1.591M5.25 12H3m4.227-4.773L5.636 5.636M15.75 12a3.75 3.75 0 1 1-7.5 0 3.75 3.75 0 0 1 7.5 0Z"
          />
        </svg>

        <!-- Icône Lune -->
        <svg
          class="swap-on col-start-1 row-start-1 h-6 w-6 text-cyan-300 drop-shadow-[0_0_10px_rgba(103,232,249,0.8)] group-hover:-rotate-12 transition-transform duration-500 ease-out"
          xmlns="http://www.w3.org/2000/svg"
          fill="none"
          viewBox="0 0 24 24"
          stroke-width="2"
          stroke="currentColor"
        >
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            d="M21.752 15.002A9.72 9.72 0 0 1 18 15.75c-5.385 0-9.75-4.365-9.75-9.75 0-1.33.266-2.597.748-3.752A9.753 9.753 0 0 0 3 11.25C3 16.635 7.365 21 12.75 21a9.753 9.753 0 0 0 9.002-5.998Z"
          />
        </svg>
      </label>
    </header>

    <!-- Zone Principale de l'application -->
    <main
      id="app"
      class="flex-1 flex flex-col items-center justify-center p-4 w-full max-w-5xl mx-auto gap-4"
    >
      <!-- Conteneur Glassmorphism -->
      <div
        class="w-full flex flex-col gap-4 p-6 rounded-3xl bg-white/20 dark:bg-white/10 backdrop-blur-xl border border-white/40 dark:border-white/20 shadow-[0_8px_32px_0_rgba(31,38,135,0.15)]"
      >
        <!-- Section Sélection des langues -->
        <section
          id="topBar"
          aria-label="Sélection des langues"
          class="flex items-center gap-3 w-full"
        >
          <!-- Select Langue Source -->
          <div class="relative flex-1">
            <label for="selectLanguageFrom" class="sr-only"
              >Langue d'origine</label
            >
            <select
              name="fromTranslate"
              id="selectLanguageFrom"
              class="w-full appearance-none px-4 py-3 pr-10 rounded-2xl font-medium text-slate-800 dark:text-white bg-white/30 dark:bg-black/30 backdrop-blur-md border border-white/50 dark:border-white/10 shadow-inner focus:outline-none focus:ring-2 focus:ring-white/80 cursor-pointer transition-all"
            >
              <option value="fr" class="bg-slate-800 text-white" selected>
                French
              </option>
              <option value="en" class="bg-slate-800 text-white">
                English
              </option>
              <option value="es" class="bg-slate-800 text-white">
                Spanish
              </option>
            </select>
            <span
              class="material-symbols-outlined absolute right-3 top-1/2 -translate-y-1/2 pointer-events-none text-slate-700 dark:text-slate-300 text-base"
            >
              expand_more
            </span>
          </div>

          <!-- Bouton Permutation -->
          <button
            type="button"
            id="swapLanguagesBtn"
            aria-label="Permuter la langue source et cible"
            class="group p-3 rounded-full grid place-items-center bg-white/40 dark:bg-white/15 border border-white/60 dark:border-white/20 shadow-md hover:bg-white/60 dark:hover:bg-white/25 active:scale-90 hover:scale-105 transition-all duration-300 cursor-pointer"
          >
            <span
              class="material-symbols-outlined text-slate-800 dark:text-white transition-transform duration-500 ease-in-out group-hover:rotate-180"
            >
              sync
            </span>
          </button>

          <!-- Select Langue Cible -->
          <div class="relative flex-1">
            <label for="selectLanguageToTranslate" class="sr-only"
              >Langue de destination</label
            >
            <select
              name="toTranslate"
              id="selectLanguageToTranslate"
              class="w-full appearance-none px-4 py-3 pr-10 rounded-2xl font-medium text-slate-800 dark:text-white bg-white/30 dark:bg-black/30 backdrop-blur-md border border-white/50 dark:border-white/10 shadow-inner focus:outline-none focus:ring-2 focus:ring-white/80 cursor-pointer transition-all"
            >
              <option value="en" class="bg-slate-800 text-white" selected>
                English
              </option>
              <option value="fr" class="bg-slate-800 text-white">French</option>
              <option value="es" class="bg-slate-800 text-white">
                Spanish
              </option>
            </select>
            <span
              class="material-symbols-outlined absolute right-3 top-1/2 -translate-y-1/2 pointer-events-none text-slate-700 dark:text-slate-300 text-base"
            >
              expand_more
            </span>
          </div>
        </section>

        <!-- Section Édition / Zones de Texte -->
        <section
          id="containerResult"
          aria-label="Zone de traduction"
          class="grid grid-cols-1 md:grid-cols-2 gap-4 w-full"
        >
          <!-- Texte Source -->
          <div class="flex flex-col gap-1.5">
            <label
              for="textToTranslate"
              class="text-xs font-semibold text-slate-700 dark:text-slate-300 ml-1"
              >Texte à traduire</label
            >
            <textarea
              name="textToTranslate"
              id="textToTranslate"
              rows="6"
              placeholder="Saisissez votre texte ici..."
              class="w-full p-4 rounded-2xl resize-none bg-slate-900/40 backdrop-blur-xl border border-white/10 shadow-lg text-slate-100 placeholder-slate-400/70 focus:outline-none focus:ring-2 focus:ring-white/20 focus:border-white/30 transition-all duration-300"
            ></textarea>
          </div>

          <!-- Texte Traduit -->
          <div class="flex flex-col gap-1.5">
            <label
              for="textTranslated"
              class="text-xs font-semibold text-slate-700 dark:text-slate-300 ml-1"
              >Traduction</label
            >
            <textarea
              name="textTranslated"
              id="textTranslated"
              rows="6"
              readonly
              placeholder="La traduction apparaîtra ici..."
              class="w-full p-4 rounded-2xl resize-none bg-slate-900/40 backdrop-blur-xl border border-white/10 shadow-lg text-slate-100 placeholder-slate-400/70 focus:outline-none transition-all duration-300 cursor-default"
            ></textarea>
          </div>
        </section>
      </div>
    </main>

    <!-- Footer -->
    <footer
      class="w-full p-4 flex items-center justify-center text-xs text-slate-500 dark:text-slate-400"
    >
      <div
        class="flex items-center gap-1.5 bg-white/10 dark:bg-black/20 backdrop-blur-md px-3 py-1.5 rounded-lg border border-white/10"
      >
        <span>Powered by</span>
        <a
          href="https://www.deepl.com"
          target="_blank"
          rel="noopener noreferrer"
          class="font-semibold text-slate-800 dark:text-slate-200 hover:underline"
        >
          DeepL.com
        </a>
      </div>
    </footer>

  </body>
</html>
