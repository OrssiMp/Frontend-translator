<!doctype html>
<html lang="fr" data-theme="light">
  <head>
    <meta charset="UTF-8" />

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0"
    />
    <title>frontend</title>
  </head>

  <body class="h-screen">
    <div id="app" class="h-full w-full hero bg-logo">
      <div id="toggleTheme" class="hero-overlay flex p-3 justify-end"></div>

      <div class="hero-content size-full bg-transparent flex flex-col gap-3">
        <!-- toggle de thème -->
        <label
          class="swap swap-rotate size-14 absolute top-2 right-3 rounded-full grid place-items-center cursor-pointer select-none bg-linear-to-br from-white/30 via-white/10 to-white/5 dark:from-white/20 dark:via-white/5 dark:to-transparent backdrop-blur-xl border border-white/50 dark:border-white/20 shadow-[0_8px_32px_0_rgba(0,0,0,0.25)] hover:scale-110 hover:border-white/80 hover:shadow-[0_12px_40px_0_rgba(0,0,0,0.35)] active:scale-90 transition-all duration-500 ease-out group"
        >
          <input
            type="checkbox"
            class="theme-controller hidden"
            value="synthwave"
          />

          <svg
            class="swap-off col-start-1 row-start-1 h-7 w-7 text-amber-300 drop-shadow-[0_0_12px_rgba(252,211,77,0.8)] group-hover:rotate-45 transition-transform duration-500 ease-out"
            xmlns="http://www.w3.org/2000/svg"
            fill="none"
            viewBox="0 0 24 24"
            stroke-width="2"
            stroke="currentColor"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              d="M12 3v2.25m6.364.386-1.591 1.591M21 12h-2.25m-.386 6.364-1.591-1.591M12 18.75V21m-4.773-4.227-1.591 1.591M5.25 12H3m4.227-4.773L5.636 5.636M15.75 12a3.75 3.75 0 1 1-7.5 0 3.75 3.75 0 0 1 7.5 0Z"
            />
          </svg>

          <svg
            class="swap-on col-start-1 row-start-1 h-7 w-7 text-cyan-300 drop-shadow-[0_0_12px_rgba(103,232,249,0.8)] group-hover:-rotate-12 transition-transform duration-500 ease-out"
            xmlns="http://www.w3.org/2000/svg"
            fill="none"
            viewBox="0 0 24 24"
            stroke-width="2"
            stroke="currentColor"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              d="M21.752 15.002A9.72 9.72 0 0 1 18 15.75c-5.385 0-9.75-4.365-9.75-9.75 0-1.33.266-2.597.748-3.752A9.753 9.753 0 0 0 3 11.25C3 16.635 7.365 21 12.75 21a9.753 9.753 0 0 0 9.002-5.998Z"
            />
          </svg>
        </label>
        <div
          class="container flex flex-col items-center gap-3 p-4 rounded-2xl bg-white/20 dark:bg-white/10 backdrop-blur-xl border border-white/40 dark:border-white/20 shadow-[0_8px_32px_0_rgba(31,38,135,0.15)] h-120"
        >
          <!-- Barre de selection -->
          <section id="topBar" class="flex items-center gap-3 w-full">
            <!-- Premier Select (Langue source) -->
            <div class="relative flex-1">
              <select
                name="fromTranslate"
                id="selectLanguageFrom"
                class="w-full appearance-none px-4 py-2.5 pr-8 rounded-xl font-medium text-slate-800 dark:text-white bg-white/30 dark:bg-black/30 backdrop-blur-md border border-white/50 dark:border-white/10 shadow-inner focus:outline-none focus:ring-2 focus:ring-white/80 cursor-pointer transition-all"
              >
                <option value="fr" class="bg-slate-800 text-white" selected>
                  French
                </option>
                <option value="en" class="bg-slate-800 text-white">
                  English
                </option>
                <option value="es" class="bg-slate-800 text-white">
                  Spanish
                </option>
              </select>
              <!-- Flèche déroulante personnalisée -->
              <span
                class="material-symbols-outlined absolute right-2.5 top-1/2 -translate-y-1/2 pointer-events-none text-slate-700 dark:text-slate-300 text-sm"
              >
                expand_more
              </span>
            </div>

            <!-- Bouton Toggle Permutation avec Icône Material "sync" (Flèches en rotation) -->
            <button
              type="button"
              aria-label="Permuter les langues"
              class="group p-2.5 rounded-full grid place-items-center bg-white/40 dark:bg-white/15 border border-white/60 dark:border-white/20 shadow-md hover:bg-white/60 dark:hover:bg-white/25 active:scale-90 hover:scale-105 transition-all duration-300 cursor-pointer"
            >
              <span
                class="material-symbols-outlined text-slate-800 dark:text-white transition-transform duration-500 ease-in-out group-hover:rotate-180"
              >
                sync
              </span>
            </button>

            <!-- Second Select (Langue cible) -->
            <div class="relative flex-1">
              <select
                name="toTranslate"
                id="selectLanguageToTranslate"
                class="w-full appearance-none px-4 py-2.5 pr-8 rounded-xl font-medium text-slate-800 dark:text-white bg-white/30 dark:bg-black/30 backdrop-blur-md border border-white/50 dark:border-white/10 shadow-inner focus:outline-none focus:ring-2 focus:ring-white/80 cursor-pointer transition-all"
              >
                <option value="defaultMessage" disabled>Pick a language</option>
                <option value="en" class="bg-slate-800 text-white" selected>
                  English
                </option>
                <option value="fr" class="bg-slate-800 text-white">
                  French
                </option>
                <option value="es" class="bg-slate-800 text-white">
                  Spanish
                </option>
              </select>
              <!-- Flèche déroulante personnalisée -->
              <span
                class="material-symbols-outlined absolute right-2.5 top-1/2 -translate-y-1/2 pointer-events-none text-slate-700 dark:text-slate-300 text-sm"
              >
                expand_more
              </span>
            </div>
          </section>
          <section id="containerResult" class="container flex h-full">
            <!-- coté gauche de traduction: texte à traduire -->
            <textarea
              name="textToTranslate"
              id="textToTranslate"
              rows="4"
              placeholder="Enter the text..."
              class="w-full p-5 rounded-2xl resize-none bg-slate-900/40 backdrop-blur-xl border border-white/10 shadow-lg text-slate-100 placeholder-slate-400/70 focus:outline-none focus:ring-2 focus:ring-white/20 focus:border-white/30 transition-all duration-300"
            ></textarea>
             <!-- coté droit de traduction: texte  traduit -->
            <textarea
              name="textTranslated"
              id="textTranslated"
              rows="4"
              placeholder="Translation..."
              class="w-full p-5 rounded-2xl resize-none bg-slate-900/40 backdrop-blur-xl border border-white/10 shadow-lg text-slate-100 placeholder-slate-400/70 focus:outline-none focus:ring-2 focus:ring-white/20 focus:border-white/30 transition-all duration-300"
            >
            </textarea>
          </section>
          
        </div>
       
      </div>
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
