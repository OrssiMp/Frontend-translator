<!doctype html>
<html lang="fr" data-theme="light">
  
  <head>
   
    <meta charset="UTF-8" />
   
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
   
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
   
    <title>frontend</title>
    
  </head>
  
  <body class="h-screen">
   
    <div id="app" class="h-full w-full hero bg-logo">
      <!-- toggle de thème -->
      <div id="toggleTheme" class="hero-overlay flex p-3 justify-end">
       
        <label
          class="swap swap-rotate size-[56px] rounded-full grid place-items-center cursor-pointer select-none bg-gradient-to-br from-white/30 via-white/10 to-white/5 dark:from-white/20 dark:via-white/5 dark:to-transparent backdrop-blur-xl border border-white/50 dark:border-white/20 shadow-[0_8px_32px_0_rgba(0,0,0,0.25)] hover:scale-110 hover:border-white/80 hover:shadow-[0_12px_40px_0_rgba(0,0,0,0.35)] active:scale-90 transition-all duration-500 ease-out group"
        >
          
          <input
            type="checkbox"
            class="theme-controller hidden"
            value="synthwave"
          />

          
          <svg
            class="swap-off col-start-1 row-start-1 h-7 w-7 text-amber-300 drop-shadow-[0_0_12px_rgba(252,211,77,0.8)] group-hover:rotate-45 transition-transform duration-500 ease-out"
            xmlns="http://www.w3.org/2000/svg"
            fill="none"
            viewBox="0 0 24 24"
            stroke-width="2"
            stroke="currentColor"
          >
           
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              d="M12 3v2.25m6.364.386-1.591 1.591M21 12h-2.25m-.386 6.364-1.591-1.591M12 18.75V21m-4.773-4.227-1.591 1.591M5.25 12H3m4.227-4.773L5.636 5.636M15.75 12a3.75 3.75 0 1 1-7.5 0 3.75 3.75 0 0 1 7.5 0Z"
            />
            
          </svg>

          
          <svg
            class="swap-on col-start-1 row-start-1 h-7 w-7 text-cyan-300 drop-shadow-[0_0_12px_rgba(103,232,249,0.8)] group-hover:-rotate-12 transition-transform duration-500 ease-out"
            xmlns="http://www.w3.org/2000/svg"
            fill="none"
            viewBox="0 0 24 24"
            stroke-width="2"
            stroke="currentColor"
          >
           
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              d="M21.752 15.002A9.72 9.72 0 0 1 18 15.75c-5.385 0-9.75-4.365-9.75-9.75 0-1.33.266-2.597.748-3.752A9.753 9.753 0 0 0 3 11.25C3 16.635 7.365 21 12.75 21a9.753 9.753 0 0 0 9.002-5.998Z"
            />
            
          </svg>
         
        </label>
        
      </div>
      
    </div>
   
    <script type="module" src="/src/main.ts"></script>
    
  </body>
</html>
